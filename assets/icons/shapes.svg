<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <pattern id="shapesp" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
