<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <pattern id="timep" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#FFF3C4"/>
      <path d="M0 0 L0 10" stroke="#F6C567" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M5 0 L5 10" stroke="#F6C567" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    </pattern>
    <filter id="soft-timep" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5b3a29" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#soft-timep)">
    <circle cx="70" cy="70" r="62" fill="url(#timep)"/>
    <circle cx="70" cy="70" r="62" fill="none" stroke="#D89A2C" stroke-width="7" stroke-dasharray="4 7" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="52" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
  </g>
  <g stroke="#8a5a2b" stroke-width="5">
      <circle cx="70" cy="70" r="34" fill="#FFFDF6"/>
    </g>
    <g stroke="#8a5a2b" stroke-width="4" stroke-linecap="round">
      <line x1="70" y1="70" x2="70" y2="50"/>
      <line x1="70" y1="70" x2="86" y2="78"/>
    </g>
    <g fill="#8a5a2b">
      <circle cx="70" cy="70" r="3.5"/>
      <circle cx="70" cy="42" r="2.6"/>
      <circle cx="98" cy="70" r="2.6"/>
      <circle cx="70" cy="98" r="2.6"/>
      <circle cx="42" cy="70" r="2.6"/>
    </g>
</svg>