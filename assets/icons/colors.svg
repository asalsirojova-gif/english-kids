<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <defs>
    <pattern id="colorsp" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#F3E8FF"/>
      <path d="M0 0 L0 10" stroke="#D9B8F5" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M5 0 L5 10" stroke="#D9B8F5" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
    </pattern>
    <filter id="soft-colorsp" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#5b3a29" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#soft-colorsp)">
    <circle cx="70" cy="70" r="62" fill="url(#colorsp)"/>
    <circle cx="70" cy="70" r="62" fill="none" stroke="#B27FE0" stroke-width="7" stroke-dasharray="4 7" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="52" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
  </g>
  <g stroke="#5c3a80" stroke-width="2.5">
      <circle cx="52" cy="50" r="13" fill="#F4A6C1"/>
      <circle cx="88" cy="50" r="13" fill="#F6C567"/>
      <circle cx="70" cy="80" r="13" fill="#8FD3C7"/>
      <circle cx="46" cy="86" r="9" fill="#9FC7F0"/>
      <circle cx="96" cy="84" r="9" fill="#F0956B"/>
    </g>
</svg>