      <g fill="#FFE8A3" stroke="#E3B84C" stroke-width="3">
        <circle cx="70" cy="46" r="16"/>
        <circle cx="96" cy="70" r="16"/>
        <circle cx="70" cy="94" r="16"/>
        <circle cx="44" cy="70" r="16"/>
      </g>
      <circle cx="70" cy="70" r="17" fill="#8FD3C7" stroke="#4FA997" stroke-width="3"/>
      <path d="M62 70 h16 M70 62 v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
